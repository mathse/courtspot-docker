services:
  web:
    build: .
    environment:
      - ALLOW_OVERRIDE=true
    ports:
      - "${WEB_PORT:-80}:80"
    dns:
      - 8.8.8.8
    depends_on:
      - db

  db:
    image: mariadb
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'

volumes:
  mysql_data:
